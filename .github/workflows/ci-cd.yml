name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - YoCode35
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Cloner le repo
        uses: actions/checkout@v4

      - name: 🏗️ Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Installer les dépendances
        run: npm install --include=dev

      - name: ✅ Vérifier Jest
        run: npm list jest || echo "Jest n'est pas installé"

      - name: Installer Jest manuellement si nécessaire
        run: npm install --save-dev jest

      - name: Lister les fichiers de test
        run: find . -name "*.test.tsx" -o -name "*.spec.tsx"

      - name: 🧪 Lancer les tests
        run: npm test  # Remplacement de CI=true et --passWithNoTests

  build:
    needs: test
    runs-on: ubuntu-latest
    if: success()  # Ne s'exécute que si les tests réussissent

    steps:
      - name: 📂 Cloner le repo
        uses: actions/checkout@v4

      - name: 🏗️ Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Installer les dépendances
        run: npm install

      - name: 🏗️ Construire l'application
        run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: 🚀 Déploiement sur Vercel via Deploy Hook
        run: |
          curl -X POST "https://api.vercel.com/v1/integrations/deploy/${{ secrets.VERCEL_PROJECT_ID }}" \
          -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
          -H "Content-Type: application/json" \
          -d '{}'
