name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - YoCode35
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Cloner le repo
        uses: actions/checkout@v4

      - name: 🏗️ Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Installer les dépendances
        run: npm install

      - name: 🧪 Lancer les tests
        run: CI=true npm run test -- --passWithNoTests

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Cloner le repo
        uses: actions/checkout@v4

      - name: 🏗️ Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Installer les dépendances
        run: npm install

      - name: 🏗️ Construire l'application
        run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Cloner à nouveau le dépôt (si nécessaire)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🚀 Déploiement sur Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
