name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - YoCode35
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Cloner le repo
        uses: actions/checkout@v4

      - name: 🏠 Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Installer les dépendances
        run: npm install --include=dev

      - name: Vérifier si Vitest est installé
        run: |
          if ! npm list vitest; then
            echo "Vitest n'est pas installé, installation en cours..."
            npm install --save-dev vitest
          fi

      - name: Lister les fichiers de test
        run: find . -name "*.test.tsx" -o -name "*.spec.tsx"

      - name: 🧠 Lancer les tests
        run: npm run test

  build:
    needs: test
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: 📂 Cloner le repo
        uses: actions/checkout@v4

      - name: 🏠 Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Installer les dépendances
        run: npm install

      - name: 🏠 Construire l'application
        run: npm run build

      - name: Vérifier si le build a échoué
        run: |
          if [ ! -d ".next" ]; then
            echo "Le build a échoué, le dossier .next n'a pas été trouvé."
            exit 1
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: 📂 Cloner le repo
        uses: actions/checkout@v4

      - name: 🚀 Déploiement sur Vercel via Deploy Hook
        id: deploy
        run: |
          # Envoie la requête POST au Deploy Hook Vercel
          response=$(curl -s -X POST "https://api.vercel.com/v1/integrations/deploy/prj_hYhuoo0p1RxCM5gfJWUNr4aM6sIB/KsyC5IgyoG" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{}' )
          echo "Réponse du déploiement: $response"

      - name: Vérification de l'état du déploiement Vercel
        run: |
          # Extraire le deployment_id de la réponse de la requête précédente
          deployment_id=$(echo ${{ steps.deploy.outputs.response }} | jq -r '.deployment.id')
          deployment_status="in_progress"

          # Boucle jusqu'à ce que le déploiement soit terminé
          while [[ "$deployment_status" == "in_progress" ]]; do
            deployment_status=$(curl -s "https://api.vercel.com/v2/deployments/$deployment_id" \
              -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" | jq -r '.state')
            echo "Statut du déploiement: $deployment_status"
            sleep 10
          done
          echo "Déploiement terminé avec statut: $deployment_status"
