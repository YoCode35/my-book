name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - YoCode35
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Cloner le repo
        uses: actions/checkout@v4

      - name: 🏠 Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22  # Utilisation de Node.js 22

      - name: 📦 Installer les dépendances
        run: npm install --include=dev

      - name: Vérifier si Vitest est installé
        run: |
          if ! npm list vitest; then
            echo "Vitest n'est pas installé, installation en cours..."
            npm install --save-dev vitest
          fi

      - name: Lister les fichiers de test
        run: find . -name "*.test.tsx" -o -name "*.spec.tsx"

      - name: 🧠 Lancer les tests
        run: npm run test  # Vérifier la commande dans package.json

  build:
    needs: test
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: 📂 Cloner le repo
        uses: actions/checkout@v4

      - name: 🏠 Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Installer les dépendances
        run: npm install

      - name: 🏠 Construire l'application
        run: npm run build

      - name: Vérifier si le build a échoué
        run: |
          # Vérifie si le dossier .next existe après le build
          if [ ! -d ".next" ]; then
            echo "Le build a échoué, le dossier .next n'a pas été trouvé."
            exit 1
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: 📂 Cloner le repo
        uses: actions/checkout@v4

      - name: 🚀 Déploiement sur Vercel via CLI
        run: |
          npm install -g vercel
          vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}

      - name: Vérifier si le déploiement a réussi
        run: |
          # Vérifie si l'URL du site est accessible après déploiement
          URL="https://my-book.vercel.app"  # Remplace par l'URL de ton projet
          if curl --silent --head --fail "$URL"; then
            echo "Déploiement réussi !"
          else
            echo "Le déploiement a échoué."
            exit 1
          fi
